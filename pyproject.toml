[build-system]
requires = ["setuptools>=66", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wise-minecraft"
version = "0.1.0"
description = "WISE: A Long-Horizon Agent in Minecraft with Why-Which Reasoning"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Renmin Cheng"},
    {name = "Changhao Chen"},
]
dependencies = []

[project.urls]
Paper = "https://openreview.net/forum?id=T8HuiP3yM9"

# Inherited MrSteve environment, kept separate from the lightweight WISE package.
# The paper reports PyTorch 2.5.1; these are the original baseline pins, not a
# reproduction environment for the WISE experiments.
[project.optional-dependencies]
baseline = [
    "gdown>=5.2.0",
    "gym3>=0.3.3",
    "hydra-core>=1.3.2",
    "lightning>=2.5.1",
    "opencv-python>=4.11.0.86",
    "patchify>=0.2.3",
    "pdc-dp-means>=0.0.8",
    "pip==23.3.1",
    "rich==13.7.1",
    "scipy>=1.15.2",
    "setuptools==66",
    "tabulate>=0.9.0",
    "torch==2.2.2",
    "wheel==0.38.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["wise*", "mrsteve*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.txt", "*.png"]
